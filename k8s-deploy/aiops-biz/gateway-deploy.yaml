apiVersion: apps/v1
kind: Deployment
metadata:
  name: biz-gateway
  namespace: data-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biz-gateway
  template:
    metadata:
      labels:
        app: biz-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-biz
      containers:
      - name: gateway
        image: aiops-gateway:20260830-5
        imagePullPolicy: IfNotPresent
        env:
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: MYSQL_ROOT_PASSWORD
        - name: GATEWAY_ORDER_WORKER_SLOTS
          value: "2"
        - name: GATEWAY_ORDER_PROCESSING_DELAY_MS
          value: "500"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: biz-gateway-svc
  namespace: data-services
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: NodePort
  selector:
    app: biz-gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
