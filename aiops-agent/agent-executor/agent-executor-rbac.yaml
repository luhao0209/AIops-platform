apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-executor-sa
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-executor-reader
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - endpoints
      - events
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-executor-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-executor-reader
subjects:
  - kind: ServiceAccount
    name: agent-executor-sa
    namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-executor-biz-gateway-remediator
  namespace: data-services
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
    resourceNames:
      - biz-gateway
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-executor-biz-gateway-remediator-binding
  namespace: data-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-executor-biz-gateway-remediator
subjects:
  - kind: ServiceAccount
    name: agent-executor-sa
    namespace: aiops
