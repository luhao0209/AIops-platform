apiVersion: v1
kind: ServiceAccount
metadata:
  name: change-watcher-sa
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: change-watcher-role
rules:
- apiGroups: [""]
  resources: ["pods", "configmaps", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: change-watcher-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: change-watcher-role
subjects:
- kind: ServiceAccount
  name: change-watcher-sa
  namespace: aiops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: change-watcher
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: change-watcher
  template:
    metadata:
      labels:
        app: change-watcher
    spec:
      serviceAccountName: change-watcher-sa
      nodeSelector:
        kubernetes.io/hostname: worker-ai
      containers:
      - name: change-watcher
        image: aiops-change-watcher:v2
        imagePullPolicy: IfNotPresent
        env:
        - name: POLL_INTERVAL
          value: "30"
        - name: WATCH_NAMESPACES
          value: "aiops,data-services,monitoring"
        - name: DATA_DIR
          value: "/app/data"
        volumeMounts:
        - name: agent-data
          mountPath: /app/data
      volumes:
      - name: agent-data
        hostPath:
          path: /root/aiops-agent/data
          type: Directory
