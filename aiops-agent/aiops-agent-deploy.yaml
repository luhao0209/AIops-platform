apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-agent
  template:
    metadata:
      labels:
        app: aiops-agent
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-ai
      containers:
        - name: aiops-agent
          image: aiops-agent:v6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: AIOPS_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: aiops-agent-auth
                  key: AIOPS_AUTH_USERNAME
            - name: AIOPS_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aiops-agent-auth
                  key: AIOPS_AUTH_PASSWORD
            - name: AIOPS_AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: aiops-agent-auth
                  key: AIOPS_AUTH_SESSION_SECRET
            - name: AIOPS_AUTH_SESSION_TTL_SECONDS
              valueFrom:
                secretKeyRef:
                  name: aiops-agent-auth
                  key: AIOPS_AUTH_SESSION_TTL_SECONDS
            - name: AIOPS_AUTH_COOKIE_SECURE
              valueFrom:
                secretKeyRef:
                  name: aiops-agent-auth
                  key: AIOPS_AUTH_COOKIE_SECURE
          volumeMounts:
            - name: agent-data
              mountPath: /app/data
      volumes:
        - name: agent-data
          hostPath:
            path: /root/aiops-agent/data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-agent-svc
  namespace: aiops
spec:
  type: NodePort
  selector:
    app: aiops-agent
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30900
