apiVersion: v1
kind: ServiceAccount
metadata:
  name: inspection-engine-sa
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inspection-engine-role
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inspection-engine-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inspection-engine-role
subjects:
- kind: ServiceAccount
  name: inspection-engine-sa
  namespace: aiops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspection-engine
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inspection-engine
  template:
    metadata:
      labels:
        app: inspection-engine
    spec:
      serviceAccountName: inspection-engine-sa
      nodeSelector:
        kubernetes.io/hostname: worker-ai
      containers:
      - name: inspection-engine
        image: aiops-inspection-engine:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9100
        volumeMounts:
        - name: agent-data
          mountPath: /app/data
      volumes:
      - name: agent-data
        hostPath:
          path: /root/aiops-agent/data
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: inspection-engine
  namespace: aiops
spec:
  selector:
    app: inspection-engine
  ports:
  - port: 9100
    targetPort: 9100
